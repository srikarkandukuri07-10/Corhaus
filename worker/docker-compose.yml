# One-command local production-equivalent run.
#
#   cd worker
#   SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... docker compose up -d --build
#
# The named volume is what makes the WhatsApp pairing survive restarts.

services:
  whatsapp-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corhaus-whatsapp-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      WA_SESSION_DIR: /data
      WORKER_ID: ${WORKER_ID:-worker-1}
    ports:
      - "8080:8080"
    volumes:
      - whatsapp-session:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  whatsapp-session: